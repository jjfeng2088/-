<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>嗓音分析工作站</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#1c2433;--muted:#687287;--line:#e1e5ec;--accent:#2563a8;--accent-2:#e8f0fa;--ok:#2f855a;--warn:#c4661a;--bad:#c53030;--side:#18222f;--side-ink:#cfd8e3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.55 "Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 12px;font-weight:700;font-size:16px;color:#fff;letter-spacing:.5px}
.brand small{display:block;font-weight:400;font-size:12px;color:#8a97a8;letter-spacing:0}
.side-tools{padding:0 14px 10px;display:flex;gap:8px}
.side-tools input{flex:1;min-width:0;background:#243245;border:1px solid #2f3f55;border-radius:6px;padding:6px 9px;color:#fff}
.side-tools button{background:var(--accent);border:0;color:#fff;border-radius:6px;padding:0 10px;cursor:pointer;white-space:nowrap}
#clientList{flex:1;overflow:auto;padding:4px 8px}
.ci{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.ci:hover{background:#223044}
.ci.on{background:#2b3d55;color:#fff}
.ci .cn{font-weight:600}
.ci .cm{font-size:12px;color:#8a97a8}
.empty-s{padding:12px;color:#8a97a8;font-size:13px}
.side-foot{border-top:1px solid #263447;padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap}
.side-foot button{background:none;border:1px solid #33465f;color:var(--side-ink);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.side-foot button:hover{background:#223044}
main{overflow:auto;min-width:0}
.head{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px 0;position:sticky;top:0;z-index:5}
.head h1{margin:0;font-size:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1 .meta{font-size:13px;font-weight:400;color:var(--muted)}
.head h1 .btn{margin-left:auto}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#content{padding:20px 24px 40px;max-width:1280px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:#b9c3d2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.inp{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;min-width:0}
textarea.inp{width:100%;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}.app{grid-template-columns:200px 1fr}}
canvas{display:block;width:100%}
.views canvas{cursor:crosshair}
.hint{color:var(--muted);font-size:12.5px}
.placeholder{border:1.5px dashed #c9d1dd;border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
table.kv{width:100%;border-collapse:collapse}
table.kv td,table.kv th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
table.kv th{color:var(--muted);font-weight:500;font-size:12.5px}
table.kv td.num{font-variant-numeric:tabular-nums;font-weight:600}
table.kv td.ref{color:var(--muted);font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#cbd2dc}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.live{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px}
.live .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px}
.live .val{font-variant-numeric:tabular-nums;color:var(--muted)}
.live .val b{color:var(--ink);font-size:16px}
.meter{flex:1;height:14px;background:#eef1f5;border-radius:7px;position:relative;overflow:hidden;min-width:120px}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#48bb78,#ecc94b 75%,#e53e3e)}
.meter .band{position:absolute;top:0;bottom:0;background:rgba(37,99,168,.18);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.grbas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.grbas label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:4px}
.grbas label b{color:var(--ink);font-size:16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{color:var(--muted);font-size:12.5px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:400;color:var(--muted)}
.dsi-bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#e53e3e,#ecc94b 50%,#48bb78);margin:14px 0 4px}
.dsi-bar i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.dsi-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--accent-2);color:var(--accent)}
.tag.vrp{background:#eaf6ee;color:#2f855a}.tag.strain{background:#fdf1e6;color:#b45309}
.readtext{font-size:20px;line-height:1.9;background:#fffdf6;border:1px solid #efe6c9;border-radius:10px;padding:18px 22px;max-height:260px;overflow:auto}
.strain-meter{position:relative;height:46px;background:#eef1f5;border-radius:10px;overflow:hidden;margin:6px 0 4px}
.strain-meter .band{position:absolute;top:0;bottom:0;background:rgba(47,133,90,.2);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.strain-meter .needle{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--ink);transform:translateX(-3px);transition:left .08s linear}
.strain-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.welcome{max-width:640px;margin:60px auto;text-align:center;color:var(--muted)}
.welcome h2{color:var(--ink)}
.welcome .mods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left;margin:24px 0}
.welcome .mods div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.welcome .mods b{color:var(--ink);display:block}
.ovl{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:12px;padding:20px 22px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:center}
.form .full{grid-column:1/-1}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
.report{background:#fff;max-width:820px;margin:0 auto;padding:36px 42px;box-shadow:0 2px 14px rgba(20,30,50,.08);border-radius:4px;color:#111}
.report h1{font-size:22px;margin:0;text-align:center;letter-spacing:2px}
.report .rsub{text-align:center;color:#555;font-size:12.5px;margin:4px 0 18px}
.report h2{font-size:15px;border-left:4px solid var(--accent);padding-left:8px;margin:22px 0 10px}
.report table{width:100%;border-collapse:collapse;font-size:13px}
.report td,.report th{border:1px solid #d6dbe3;padding:5px 8px;text-align:left}
.report th{background:#f4f6f9;font-weight:600}
.report img{width:100%;display:block;margin:8px 0;border:1px solid #eceff4}
.report .info td{border:0;padding:3px 8px}
.report .sign{display:flex;justify-content:space-between;margin-top:36px;font-size:13px}
.report .note{font-size:11.5px;color:#666;margin-top:20px;line-height:1.6}
.sel-list label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff}
 .app{display:block;height:auto}
 aside,.head,.no-print,#toast{display:none!important}
 main{overflow:visible}
 #content{padding:0;max-width:none}
 .report{box-shadow:none;padding:0;max-width:none}
 .report h2,.report img,.report table{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="brand">嗓音分析工作站<small>Voice Lab · 工作室版</small></div>
  <div class="side-tools"><input id="search" placeholder="搜索学员" oninput="renderSidebar()"><button onclick="editClient()">+ 新建</button></div>
  <div id="clientList"></div>
  <div class="side-foot"><button onclick="openSettings()">⚙ 设置与校准</button><button onclick="exportBackup()">导出备份</button><label><button onclick="this.nextElementSibling.click()">导入备份</button><input type="file" accept=".json" hidden onchange="importBackup(this)"></label></div>
 </aside>
 <main id="main"></main>
</div>
<div id="toast"></div>
<audio id="player" hidden></audio>
<script>
/* ============ 基础工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fx=(v,d=1)=>v==null||!isFinite(v)?'—':(+v).toFixed(d);
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const hzMidi=f=>69+12*Math.log2(f/440), midiHz=m=>440*2**((m-69)/12);
const noteName=m=>{const r=Math.round(m);return NOTES[((r%12)+12)%12]+(Math.floor(r/12)-1)};
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:NaN;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
const median=a=>{if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y);return b[b.length>>1]};
const TYPE={vowel:'唱音分析',vrp:'音域测量',strain:'疲劳测试'};
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}

const S=(()=>{const d={calib:100,fmin:60,fmax:1100,deviceId:'',studio:'',examiner:''};try{return Object.assign(d,JSON.parse(localStorage.getItem('voicelab.settings')||'{}'))}catch(e){return d}})();
function saveSettings(){try{localStorage.setItem('voicelab.settings',JSON.stringify(S))}catch(e){}}

/* ============ 数据库 (IndexedDB, 数据只保存在本机浏览器) ============ */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('voicelab',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('clients',{keyPath:'id'});d.createObjectStore('sessions',{keyPath:'id'}).createIndex('client','clientId')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),r=fn(t.objectStore(store));let out;if(r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
 all(s){return this.tx(s,'readonly',o=>o.getAll())},
 put(s,v){return this.tx(s,'readwrite',o=>o.put(v))},
 del(s,id){return this.tx(s,'readwrite',o=>o.delete(id))},
 byClient(cid){return this.tx('sessions','readonly',o=>o.index('client').getAll(cid))}
};

/* ============ DSP ============ */
function fft(re,im){const n=re.length;
 for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),h=len>>1;
  for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<h;k++){const a=i+k,b=a+h,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}
}
const hann=n=>{const w=new Float64Array(n);for(let i=0;i<n;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/(n-1));return w};
const _kern={};
function lpKernel(k){if(_kern[k])return _kern[k];const T=63,fc=.45/k,h=new Float32Array(T);let s=0;
 for(let i=0;i<T;i++){const m=i-(T-1)/2,v=m===0?2*fc:Math.sin(2*Math.PI*fc*m)/(Math.PI*m);h[i]=v*(.54-.46*Math.cos(2*Math.PI*i/(T-1)));s+=h[i]}
 for(let i=0;i<T;i++)h[i]/=s;return _kern[k]=h}
// 降采样到约 16 kHz，用于基频跟踪
function decimate(x,sr){const k=Math.max(1,Math.round(sr/16000));if(k===1)return{y:x,sr};
 const h=lpKernel(k),T=h.length,half=(T-1)>>1,n=Math.floor(x.length/k),y=new Float32Array(n),L=x.length;
 for(let i=0;i<n;i++){const c=i*k-half;let a=0;if(c>=0&&c+T<=L){for(let t=0;t<T;t++)a+=h[t]*x[c+t]}else{for(let t=0;t<T;t++){const j=c+t;if(j>=0&&j<L)a+=h[t]*x[j]}}y[i]=a}
 return{y,sr:sr/k}}
// YIN 基频估计（FFT 加速）
function makeYin(sr,fmin,fmax){
 const maxLag=Math.ceil(sr/fmin),minLag=Math.max(2,Math.floor(sr/fmax)),W=Math.max(maxLag,Math.round(sr*.03)),N=W+maxLag;let F=1;while(F<N+W)F<<=1;
 const ar=new Float64Array(F),ai=new Float64Array(F),br=new Float64Array(F),bi=new Float64Array(F),cm=new Float64Array(maxLag+2),d=new Float64Array(maxLag+2),e=new Float64Array(N+1);
 return{W,N,maxLag,run(x,off){
  ar.fill(0);ai.fill(0);br.fill(0);bi.fill(0);e[0]=0;
  for(let i=0;i<N;i++){const v=x[off+i]||0;br[i]=v;if(i<W)ar[i]=v;e[i+1]=e[i]+v*v}
  fft(ar,ai);fft(br,bi);
  for(let i=0;i<F;i++){const re=ar[i]*br[i]+ai[i]*bi[i],im=ar[i]*bi[i]-ai[i]*br[i];ar[i]=re;ai[i]=-im}
  fft(ar,ai);
  const e0=e[W];let run=0;cm[0]=1;
  for(let t=1;t<=maxLag;t++){d[t]=Math.max(0,e0+(e[t+W]-e[t])-2*ar[t]/F);run+=d[t];cm[t]=run>0?d[t]*t/run:1}
  let best=-1;
  for(let t=minLag;t<=maxLag;t++){if(cm[t]<.15){while(t+1<=maxLag&&cm[t+1]<cm[t])t++;best=t;break}}
  if(best<0){let mv=1e9;for(let t=minLag;t<=maxLag;t++)if(cm[t]<mv){mv=cm[t];best=t}}
  let tau=best;if(best>minLag&&best<maxLag){const a=cm[best-1],b=cm[best],c=cm[best+1],den=a-2*b+c;if(den>0)tau=best+.5*(a-c)/den}
  const et=e[best+W]-e[best],nac=e0>0&&et>0?(ar[best]/F)/Math.sqrt(e0*et):0;
  return{f0:sr/tau,cmnd:cm[best],nac,rms:Math.sqrt(e0/W)}}}
}
// 实时分析器：每个音频块给出 F0 与声级
function makeRT(sr){const k=Math.max(1,Math.round(sr/16000)),yin=makeYin(sr/k,S.fmin,S.fmax),need=yin.N*k+80,buf=new Float32Array(need);
 return{push(ch){if(ch.length>=need)buf.set(ch.subarray(ch.length-need));else{buf.copyWithin(0,ch.length);buf.set(ch,need-ch.length)}
  const{y}=decimate(buf,sr),r=yin.run(y,y.length-yin.N);let s=0;for(let i=0;i<ch.length;i++)s+=ch[i]*ch[i];
  const db=20*Math.log10(Math.sqrt(s/ch.length)+1e-9)+S.calib;return{f0:r.cmnd<.25?r.f0:0,db}}}}

// 整段信号分析：10 ms 帧的 F0 / 声级 / 周期性
function analyzeSignal(x,sr){
 const{y,sr:ds}=decimate(x,sr),yin=makeYin(ds,S.fmin,S.fmax),hop=Math.round(ds*.01),fr=[];
 for(let off=0;off+yin.N<=y.length;off+=hop){const r=yin.run(y,off);fr.push({t:(off+yin.W/2)/ds,f0:r.f0,cm:r.cmnd,nac:r.nac,db:20*Math.log10(r.rms+1e-9)+S.calib})}
 let maxDb=-1e9;for(const f of fr)if(f.db>maxDb)maxDb=f.db;
 for(const f of fr)f.v=f.cm<.3&&f.db>maxDb-35;
 const raw=fr.map(f=>f.f0);
 for(let i=0;i<fr.length;i++){if(!fr[i].v)continue;const w=[];for(let j=i-3;j<=i+3;j++)if(j>=0&&j<fr.length&&fr[j].v)w.push(raw[j]);const m=median(w);if(Math.abs(12*Math.log2(raw[i]/m))>2.5)fr[i].f0=m}
 // 去掉短于 50 ms 的孤立浊音段
 for(let i=0;i<fr.length;){if(!fr[i].v){i++;continue}let j=i;while(j<fr.length&&fr[j].v)j++;if(j-i<5)for(let k=i;k<j;k++)fr[k].v=false;i=j}
 // 最长连续发声段（允许 100 ms 内的间断），作为 MPT 与默认分析区间
 let best=null;const runs=[];for(let i=0;i<fr.length;){if(!fr[i].v){i++;continue}let j=i,last=i;while(j<fr.length&&(fr[j].v||j-last<=10)){if(fr[j].v)last=j;j++}runs.push([i,last]);if(!best||last-i>best[1]-best[0])best=[i,last];i=j}
 const A={x,sr,y,ds,frames:fr,dur:x.length/sr,mpt:best?(best[1]-best[0]+1)*.01:0};
 // 各次发声（≥0.5 s），用于按次分析
 A.phons=runs.filter(r=>(r[1]-r[0])*.01>=.5).map(r=>[fr[r[0]].t,fr[r[1]].t]);
 if(best){const a=fr[best[0]].t,b=fr[best[1]].t,trim=(b-a)*.15;A.sel=[a+trim,b-trim]}else A.sel=[0,A.dur];
 return A}

function cycleMeasures(A,t0,t1){
 const x=A.x,sr=A.sr,F=A.frames,base=F.length?F[0].t:0;
 const f0At=t=>{const i=Math.round((t-base)/.01);for(let d=0;d<6;d++)for(const j of[i-d,i+d])if(j>=0&&j<F.length&&F[j].v)return F[j].f0;return 0};
 let s=Math.max(1,Math.floor(t0*sr));const e=Math.min(x.length-2,Math.floor(t1*sr));
 let mx=0,mn=0;for(let i=s;i<e;i++){if(x[i]>mx)mx=x[i];if(x[i]<mn)mn=x[i]}
 const sg=-mn>mx?-1:1;

 g.translate(0,h1);const v=secs.filter(s=>s.f0);let lo=v.length?Math.min(...v.map(s=>s.f0))*.9:80,hi=v.length?Math.max(...v.map(s=>s.f0))*1.1:400;
 const tm=T>=120,o2=axes(g,w,h-h1,{x0:0,x1:T,y0:lo,y1:hi,xt:tm?ticks(0,T/60,8).map(v=>v*60):ticks(0,T,10),xf:t=>tm?+(t/60).toFixed(2)+' 分':t+' 秒',yt:ticks(lo,hi,4),yf:t=>Math.round(t),yl:'F0 Hz',m:{t:6}});

 g.strokeStyle='#cfd5de';g.setLineDash([3,3]);for(let i=1;i<plan.levels.length;i++){const X=Math.round(o2.X(i*plan.secDur))+.5;g.beginPath();g.moveTo(X,-h1+M.t);g.lineTo(X,h-h1-o2.m.b);g.stroke()}g.setLineDash([]);g.translate(0,-h1)}

 const mpt=Math.max(...vs.map(s=>s.results.mpt||0)),jit=vv(withJ[0],'jitter'),r=vr[0].results;
 return{dsi:dsiCalc(mpt,r.f0hi,r.ilow,jit),mpt,jit,f0hi:r.f0hi,ilow:r.ilow}}

function viewReport(){const c=client();
 if(!repSel||repSel.cid!==c.id){repSel={cid:c.id,ids:new Set(['vowel','vrp','strain'].map(t=>sessions.find(s=>s.type===t)).filter(Boolean).map(s=>s.id)),opinion:'',examiner:S.examiner||''}}
 $('#content').innerHTML=`<div class="grid2 no-print" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="card"><h3>选择要写入报告的记录</h3><div class="sel-list">${sessions.length?sessions.map(s=>`<label><input type="checkbox" ${repSel.ids.has(s.id)?'checked':''} onchange="this.checked?repSel.ids.add('${s.id}'):repSel.ids.delete('${s.id}');renderReport()"><span class="tag ${s.type}">${TYPE[s.type]}</span> ${fmtDate(s.created)} ${esc(s.label)}</label>`).join(''):'<div class="hint">暂无测试记录</div>'}</div></div>
  <div class="card"><h3>评估意见</h3><textarea class="inp" rows="5" placeholder="综合评估、训练建议、复查时间…" oninput="repSel.opinion=this.value;renderReport()">${esc(repSel.opinion)}</textarea>
  <div class="toolbar" style="margin:10px 0 0"><input class="inp" placeholder="评估人" value="${esc(repSel.examiner)}" oninput="repSel.examiner=this.value;S.examiner=this.value;saveSettings();renderReport()"><span class="grow"></span><button class="btn primary" onclick="window.print()">打印 / 另存为 PDF</button></div></div></div>
  <div id="reportBox"></div>`;renderReport()}
function renderReport(){const c=client(),sel=sessions.filter(s=>repSel.ids.has(s.id)).sort((a,b)=>a.created-b.created),dsi=computeDsi(sel.slice().reverse());
 const W=720,parts=[];
 for(const s of sel){const r=s.results;
  if(s.type==='vowel'){const fr=(s.track||[]).map(([t,f0,db])=>({t,f0,db,v:f0>0})),img=fr.length?imgOf(W,170,(g,w,h)=>drawF0(g,w,h,fr,s.dur||fr[fr.length-1].t,[r.t0,r.t1])):'';const g=s.grbas||{};
   parts.push(`<h2>唱音分析 · ${fmtDate(s.created)} ${esc(s.label)}</h2>${img?`<img src="${img}">`:''}${s.phon&&s.phon.n>=2?(()=>{const P=s.phon,c=(k,d)=>`${fx(P.mean[k],d)} ± ${fx(P.sd[k],d)}`;return`<table><tr><th>${P.n} 次发声</th><th>平均值 ± 标准差</th><th></th><th>平均值 ± 标准差</th></tr>
    <tr><th>声级</th><td>${c('db',0)} dB</td><th>基频 F0</th><td>${c('f0mean',0)} Hz</td></tr><tr><th>Jitter</th><td>${c('jitter',2)} %</td><th>Shimmer</th><td>${c('shimmer',2)} %</td></tr><tr><th>HNR</th><td>${c('hnr',1)} dB</td><th>CPP</th><td>${c('cpp',1)} dB</td></tr></table><p style="font-size:12px;color:#555;margin:6px 0">选区详细参数：</p>`})():''}<table><tr><th>F0 平均</th><th>F0 SD</th><th>Jitter</th><th>RAP</th><th>PPQ5</th><th>Shimmer</th><th>Shimmer dB</th><th>HNR</th><th>CPP</th><th>MPT</th></tr>
    <tr><td>${fx(r.f0mean)} Hz</td><td>${fx(r.f0sd,2)} Hz</td><td>${fx(r.jitter,2)}%</td><td>${fx(r.rap,2)}%</td><td>${fx(r.ppq5,2)}%</td><td>${fx(r.shimmer,2)}%</td><td>${fx(r.shimDb,2)}</td><td>${fx(r.hnr)} dB</td><td>${fx(r.cpp)} dB</td><td>${fx(r.mpt)} s</td></tr></table>
    <table style="margin-top:6px"><tr><th style="width:120px">GRBAS</th><td>G${g.G??0} R${g.R??0} B${g.B??0} A${g.A??0} S${g.S??0}</td></tr>${s.comment?`<tr><th>听感描述</th><td style="white-space:pre-wrap">${esc(s.comment)}</td></tr>`:''}</table>`)}
  if(s.type==='vrp'&&r){const img=imgOf(W,330,(g,w,h)=>drawVrp(g,w,h,s.points||[]));
   parts.push(`<h2>音域测量（声域图）· ${fmtDate(s.created)}</h2><img src="${img}"><table><tr><th>最低音</th><th>最高音</th><th>音域跨度</th><th>最小声强</th><th>最大声强</th><th>面积</th></tr><tr><td>${noteName(r.lo)} (${fx(r.f0lo,0)} Hz)</td><td>${noteName(r.hi)} (${fx(r.f0hi,0)} Hz)</td><td>${r.range} 半音</td><td>${fx(r.ilow)} dB</td><td>${fx(r.ihigh)} dB</td><td>${fx(r.area,0)} dB·半音</td></tr></table>${s.comment?`<p>${esc(s.comment)}</p>`:''}`)}
  if(s.type==='strain'){const img=imgOf(W,280,(g,w,h)=>drawStrain(g,w,h,r));
   parts.push(`<h2>声音疲劳测试 · ${fmtDate(s.created)}</h2><img src="${img}"><table><tr><th>段</th><th>目标</th><th>平均声级</th><th>达标率</th><th>平均 F0</th><th>F0 波动</th></tr>${r.stats.map((x,i)=>`<tr><td>${i+1}</td><td>${x.target} dB</td><td>${fx(x.db)} dB</td><td>${fx(x.inTarget*100,0)}%</td><td>${fx(x.f0)} Hz</td><td>${fx(x.f0sdSt,2)} 半音</td></tr>`).join('')}</table>
    ${trendLine(r)}${r.pre!=null||r.post!=null?`<p>疲劳自评：测试前 ${r.pre??'—'}，测试后 ${r.post??'—'}（0–10）</p>`:''}${r.comment?`<p>${esc(r.comment)}</p>`:''}`)}}
 $('#reportBox').innerHTML=`<div class="report"><h1>${esc(S.studio||'')}嗓音评估报告</h1><div class="rsub">报告日期 ${fmtDate(Date.now()).slice(0,10)}</div>
  <table class="info"><tr><td>姓名：${esc(c.name)}</td><td>编号：${esc(c.code||'—')}</td><td>性别：${esc(c.sex||'—')}</td><td>年龄：${age(c.birth)||'—'}</td><td>声部：${esc(c.voice||'—')}</td></tr></table>
  ${dsi?`<h2>嗓音障碍严重指数（DSI）</h2><table><tr><th>DSI</th><th>MPT</th><th>F0 高</th><th>I 低</th><th>Jitter</th></tr><tr><td><b>${fx(dsi.dsi,1)}</b></td><td>${fx(dsi.mpt)} s</td><td>${fx(dsi.f0hi,0)} Hz</td><td>${fx(dsi.ilow)} dB</td><td>${fx(dsi.jit,2)}%</td></tr></table><p style="font-size:12px;color:#555">DSI = 0.13·MPT + 0.0053·F0高 − 0.26·I低 − 1.18·Jitter + 12.4；+5 为正常嗓音，−5 为重度嗓音障碍。</p>`:''}
  ${parts.join('')||'<p style="color:#888">请在上方勾选要写入报告的测试记录。</p>'}
  ${repSel.opinion?`<h2>评估意见</h2><p style="white-space:pre-wrap">${esc(repSel.opinion)}</p>`:''}
  <div class="sign"><span>评估人：${esc(repSel.examiner)}</span><span>日期：${fmtDate(Date.now()).slice(0,10)}</span></div>
  <div class="note">本报告的声学参数由嗓音分析工作站计算，声级数值基于麦克风校准结果。报告用于嗓音训练评估参考，不能替代医学诊断。</div></div>`}

/* ---------- 设置与校准 ---------- */
async function openSettings(){await stopActive();
 const d=modal(`<h3>设置与校准</h3><div class="form">
  <label>工作室名称</label><input class="inp" id="stStudio" value="${esc(S.studio)}" placeholder="显示在报告标题">
  <label>麦克风</label><select class="inp" id="stDev"><option value="">系统默认</option></select>
  <label>F0 范围</label><span><input class="inp" id="stFmin" type="number" value="${S.fmin}" style="width:80px"> – <input class="inp" id="stFmax" type="number" value="${S.fmax}" style="width:80px"> Hz</span>
  <label>校准偏移</label><span><input class="inp" id="stCal" type="number" step="0.1" value="${S.calib}" style="width:100px"> dB</span>
  <div class="full card" style="margin:6px 0 0;background:#f8fafc"><b>用声级计校准</b><p class="hint" style="margin:4px 0 8px">在麦克风旁 30 cm 处放置声级计（或手机声级计 App）；点“开始”，发一个稳定的长音或播放稳定的噪声，把声级计读数填在右侧，点“应用”。</p>
   <div class="toolbar" style="margin:0"><button class="btn" id="stCalBtn" onclick="calibToggle()">开始</button><span class="val">当前读数 <b id="stCur">—</b> dB</span><input class="inp" id="stRef" type="number" placeholder="声级计读数" style="width:110px"><button class="btn primary" onclick="calibApply()">应用</button></div></div></div>
  <div class="acts"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="settingsSave()">保存</button></div>`);
 d._onclose=()=>Mic.stop();
 try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='audioinput'&&x.deviceId&&x.deviceId!=='default');$('#stDev').innerHTML+=devs.map((x,i)=>`<option value="${esc(x.deviceId)}" ${x.deviceId===S.deviceId?'selected':''}>${esc(x.label||'麦克风 '+(i+1))}</option>`).join('')}catch(e){}}
let calRaw=null;
async function calibToggle(){if(Mic.active){await Mic.stop();$('#stCalBtn').textContent='开始';return}
 const keep=S.deviceId;S.deviceId=$('#stDev').value;let acc=[];
 try{await Mic.start(d=>{let s=0;for(const v of d)s+=v*v;acc.push(s/d.length);if(acc.length>10)acc.shift();calRaw=10*Math.log10(mean(acc)+1e-18);const el=$('#stCur');if(el)el.textContent=fx(calRaw+(+$('#stCal').value),1)})}catch(e){toast('无法打开麦克风：'+e.message,5000)}
 S.deviceId=keep;$('#stCalBtn').textContent='停止'}
function calibApply(){const ref=+$('#stRef').value;if(!ref||calRaw==null){toast('请先开始测量并填写声级计读数');return}$('#stCal').value=(ref-calRaw).toFixed(1);toast('已计算校准偏移，点“保存”生效')}
async function settingsSave(){S.studio=$('#stStudio').value.trim();S.deviceId=$('#stDev').value;S.fmin=Math.max(40,+$('#stFmin').value||60);S.fmax=Math.min(2000,Math.max(S.fmin+50,+$('#stFmax').value||1100));S.calib=+$('#stCal').value||0;saveSettings();await closeModal();toast('设置已保存');renderMain()}

/* ---------- 备份 ---------- */
const blobToUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function exportBackup(){toast('正在打包…');const ss=await DB.all('sessions');for(const s of ss)if(s.audio instanceof Blob)s.audio=await blobToUrl(s.audio);
 download(new Blob([JSON.stringify({app:'voicelab',version:1,exported:Date.now(),settings:S,clients:await DB.all('clients'),sessions:ss})],{type:'application/json'}),`嗓音工作站备份_${fmtDate(Date.now()).replace(/[: ]/g,'-')}.json`)}
async function importBackup(inp){const f=inp.files[0];inp.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='voicelab')throw new Error('不是本软件的备份文件');
 if(!confirm(`将导入 ${d.clients.length} 位学员、${d.sessions.length} 条记录（相同记录会被覆盖）。继续？`))return;
 for(const c of d.clients)await DB.put('clients',c);for(const s of d.sessions){if(typeof s.audio==='string')s.audio=await(await fetch(s.audio)).blob();await DB.put('sessions',s)}
 clients=await DB.all('clients');renderSidebar();if(cur.cid){await loadSessions();renderMain()}toast('导入完成')}catch(e){toast('导入失败：'+e.message,5000)}}

/* ---------- 启动 ---------- */
let rsz=0;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(cur.tab==='vowel')drawVowel();else if(cur.tab==='vrp')drawVrpNow();else if(cur.tab==='strain'&&ST&&ST.phase==='done')viewStrain()},150)});
(async()=>{try{await DB.open();clients=await DB.all('clients')}catch(e){toast('无法打开本地数据库：'+e.message,8000)}renderSidebar();renderMain()})();
</script>
</body>
